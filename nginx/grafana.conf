server {
    listen 80;
    server_name grafana.leonet.site;
    return 301 https://$host$request_uri; # Редирект на HTTPS
}

server {
    listen 443 ssl;
    server_name grafana.leonet.site;

    ssl_certificate /etc/letsencrypt/live/grafana.leonet.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.leonet.site/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Настройки для WebSocket (нужно для работы live-логов в Grafana)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
